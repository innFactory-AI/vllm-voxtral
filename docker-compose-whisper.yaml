services:
  whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: whisper-speaches
    ports:
      - "9000:8000"
    environment:
      - WHISPER__MODEL=small
      - WHISPER__COMPUTE_TYPE=int8
      - WHISPER__DEVICE=cpu
      # Pre-load model at startup instead of on first request
      - SPEACHES__PRELOAD_MODELS=["Systran/faster-whisper-small"]
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

volumes:
  whisper-models:
